<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniContests — Global Tech & AI Competition Radar</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: #1f2937;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --cash: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text-main); min-height: 100vh; padding: 2rem; }
    .header { max-width: 1300px; margin: 0 auto 2rem; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .title h1 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .title p { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.3rem; }
    .stats { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .stat-box { background: var(--card-bg); border: 1px solid var(--border); padding: 0.75rem 1.25rem; border-radius: 8px; text-align: center; }
    .stat-val { font-size: 1.3rem; font-weight: 700; color: var(--cash); }
    .stat-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .controls { max-width: 1300px; margin: 0 auto 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .controls-row1 { display: flex; gap: 1rem; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 280px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; color: #fff; font-size: 0.95rem; }
    .search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
    .sort-select { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; color: #fff; font-size: 0.95rem; cursor: pointer; }
    
    .filter-pills { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .pill { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 0.5rem 0.9rem; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
    .pill:hover, .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
    .pill-status { border-style: dashed; }

    .grid { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 1.25rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.15s, border-color 0.15s; position: relative; overflow: hidden; }
    .card:hover { transform: translateY(-3px); border-color: #374151; }
    .card.is-closed { opacity: 0.65; border-color: #262626; }
    .card.is-closed:hover { opacity: 1; border-color: #ef4444; }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; }
    .badge { font-size: 0.7rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-kaggle { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .badge-devpost { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .badge-security { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .badge-quant { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .badge-other { background: rgba(167, 139, 250, 0.15); color: #c084fc; }

    .temporal-badge { font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.5rem; border-radius: 4px; display: inline-block; margin-bottom: 0.5rem; }
    .badge-urgent { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-active { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-closed { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }

    .prize { font-size: 1.35rem; font-weight: 800; color: var(--cash); }
    .comp-name { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 0.3rem; line-height: 1.3; }
    .unit-tag { font-size: 0.8rem; color: #60a5fa; margin-bottom: 0.5rem; font-weight: 600; }
    .details { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 1rem; }
    .feasibility { font-size: 0.8rem; background: rgba(16, 185, 129, 0.08); border-left: 3px solid var(--cash); padding: 0.4rem 0.6rem; border-radius: 0 4px 4px 0; margin-bottom: 1rem; color: #a7f3d0; }
    
    .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 0.75rem; }
    .deadline { font-weight: 600; }

    .modal-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: center; padding: 1rem; }
    .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; max-width: 650px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 2rem; position: relative; }
    .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
    .modal h2 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    .modal-prize { font-size: 1.8rem; font-weight: 800; color: var(--cash); margin-bottom: 1rem; }
    .modal-sec { margin-bottom: 1rem; font-size: 0.9rem; }
    .modal-sec h4 { color: #9ca3af; text-transform: uppercase; font-size: 0.75rem; margin-bottom: 0.3rem; letter-spacing: 0.5px; }
  </style>
</head>

  <div class="grid" id="grid"></div>

    <div class="modal">

      <div id="modalContent"></div>
    </div>
  </div>

    function formatUSD(num) {
      if (!num || num === 0) return 'Various / Undisclosed';
      return '$' + num.toLocaleString() + ' USD';
    }

    function getBadgeClass(platform, disc) {
      const p = (platform || '').toLowerCase();
      if (p.includes('kaggle')) return 'badge-kaggle';
      if (p.includes('devpost')) return 'badge-devpost';
      if (disc === 'security_and_bounties') return 'badge-security';
      if (disc === 'quantitative_trading') return 'badge-quant';
      return 'badge-other';
    }

    function getTemporalClass(badge) {
      if (badge.includes('URGENT')) return 'badge-urgent';
      if (badge.includes('CLOSED')) return 'badge-closed';
      return 'badge-active';
    }

    let currentFilter = 'all';
    let hideClosed = true;
    let searchQuery = '';
    let currentSort = 'prize';

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      let totalPrize = 0;
      let activeCount = 0;
      let totalCount = data.length;

      const filtered = data.filter(item => {
        const isClosed = (item.days_remaining !== null && item.days_remaining < 0) || item.status === 'ARCHIVED_CLOSED';
        if (hideClosed && isClosed) return false;
        if (currentFilter !== 'all' && item.discipline !== currentFilter) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchName = (item.name || '').toLowerCase().includes(q);
          const matchPlatform = (item.platform || '').toLowerCase().includes(q);
          const matchUnit = (item.project_unit || '').toLowerCase().includes(q);
          if (!matchName && !matchPlatform && !matchUnit) return false;
        }
        return true;
      });

      // Sorting
      filtered.sort((a, b) => {
        if (currentSort === 'prize') {
          return (b.total_prize_usd || 0) - (a.total_prize_usd || 0);
        } else if (currentSort === 'urgency') {
          const da = a.days_remaining !== null ? a.days_remaining : 9999;
          const db = b.days_remaining !== null ? b.days_remaining : 9999;
          return da - db;
        } else {
          return (a.name || '').localeCompare(b.name || '');
        }
      });

      filtered.forEach(item => {
        const isClosed = (item.days_remaining !== null && item.days_remaining < 0) || item.status === 'ARCHIVED_CLOSED';
        if (!isClosed) {
          totalPrize += (item.total_prize_usd || 0);
          activeCount++;
        }

        const card = document.createElement('div');
        card.className = 'card' + (isClosed ? ' is-closed' : '');
        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="badge ${getBadgeClass(item.platform, item.discipline)}">${item.platform || 'General'}</span>
              <span class="prize">${formatUSD(item.total_prize_usd)}</span>
            </div>
            <div class="temporal-badge ${getTemporalClass(item.temporal_badge)}">${item.temporal_badge}</div>
            <div class="comp-name">${item.name}</div>
            <div class="unit-tag">📌 ${item.project_unit || 'General Unit'}</div>
            <div class="details">${(item.prize_description || item.category || '').slice(0, 110)}...</div>
            <div class="feasibility">⚡ ${item.free_compute_feasibility || '0 EUR compute feasible'}</div>
          </div>
          <div class="card-footer">
            <span class="deadline">⏳ ${item.deadline_utc ? item.deadline_utc.slice(0, 25) : 'Rolling / Continuous'}</span>
            <span style="color:#3b82f6; cursor:pointer; font-weight:600;">Inspect Dossier &rarr;</span>
          </div>
        `;

        card.addEventListener('click', () => openModal(item));
        grid.appendChild(card);
      });

      document.getElementById('totalPrizes').textContent = '$' + totalPrize.toLocaleString() + ' USD';
      document.getElementById('activeCount').textContent = activeCount;
      document.getElementById('totalCount').textContent = totalCount;
    }

    function openModal(item) {
      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = `
        <span class="badge ${getBadgeClass(item.platform, item.discipline)}" style="margin-bottom:0.5rem; display:inline-block;">${item.platform}</span>
        <div class="temporal-badge ${getTemporalClass(item.temporal_badge)}" style="margin-left:0.5rem;">${item.temporal_badge}</div>
        <h2>${item.name}</h2>
        <div class="modal-prize">${formatUSD(item.total_prize_usd)}</div>
        
        <div class="modal-sec">
          <h4>Temporal Status & Verified Runway</h4>
          <p style="font-weight:700;">${item.deadline_utc || 'Open continuous / rolling schedule'}</p>
        </div>

        <div class="modal-sec">
          <h4>Assigned Institutional Unit</h4>
          <p style="color:#60a5fa; font-weight:600;">${item.project_unit || 'General Unit'}</p>
        </div>

        <div class="modal-sec">
          <h4>Prize Allocation & Bounty Structure</h4>
          <p>${item.prize_description || item.category || 'Official reward governed by contest terms.'}</p>
        </div>

        <div class="modal-sec">
          <h4>Compute Guardrail (Strict 0 EUR Standard)</h4>
          <p style="color:#a7f3d0;">${item.free_compute_feasibility || '100% feasible on local CPU or verified free tier quotas.'}</p>
        </div>

        <div class="modal-sec">
          <h4>Deliverable Specification</h4>
          <p>${item.deliverable || 'Reproducible code repository, Kaggle notebook, or technical paper.'}</p>
        </div>

        <div class="modal-sec">
          <h4>Governance & Key Constraints (KYC / IP / Eligibility)</h4>
          <p style="color:#9ca3af;">${item.restrictions || 'Standard global developer eligibility. Participant retains background IP.'}</p>
        </div>
      `;
      document.getElementById('modalBackdrop').style.display = 'flex';
    }

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modalBackdrop').style.display = 'none';
    });

    document.getElementById('modalBackdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modalBackdrop') {
        document.getElementById('modalBackdrop').style.display = 'none';
      }
    });

    // Search input listener
    document.getElementById('search').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    // Sort select listener
    document.getElementById('sortSelect').addEventListener('change', (e) => {
      currentSort = e.target.value;
      render();
    });

    // Discipline pills listener
    document.querySelectorAll('.filter-pills .pill:not(.pill-status)').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-pills .pill:not(.pill-status)').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        render();
      });
    });

    // Toggle closed competitions listener
    const toggleClosedBtn = document.getElementById('toggleClosed');
    toggleClosedBtn.addEventListener('click', () => {
      hideClosed = !hideClosed;
      if (hideClosed) {
        toggleClosedBtn.classList.add('active');
        toggleClosedBtn.textContent = '👁️ Hide Closed';
      } else {
        toggleClosedBtn.classList.remove('active');
        toggleClosedBtn.textContent = '👁️ Show All (Including Closed)';
      }
      render();
    });

    // Initial render
    render();
  </script>
</body>
</html>
