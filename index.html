    function formatUSD(num) {
      if (!num || num === 0) return 'Various / Undisclosed';
      return '$' + num.toLocaleString() + ' USD';
    }

    function getBadgeClass(platform, disc) {
      const p = (platform || '').toLowerCase();
      if (p.includes('kaggle')) return 'badge-kaggle';
      if (p.includes('devpost')) return 'badge-devpost';
      if (disc === 'security_and_bounties') return 'badge-security';
      if (disc === 'quantitative_trading') return 'badge-quant';
      return 'badge-other';
    }

    function getTemporalClass(badge) {
      if (badge.includes('URGENT')) return 'badge-urgent';
      if (badge.includes('CLOSED')) return 'badge-closed';
      return 'badge-active';
    }

    let currentFilter = 'all';
    let hideClosed = true;
    let verifiedOnly = false;
    let searchQuery = '';
    let currentSort = 'urgency';

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      let totalPrize = 0;
      let activeCount = 0;
      let totalCount = data.length;

      const filtered = data.filter(item => {
        const isClosed = (item.days_remaining !== null && item.days_remaining < 0) || item.status === 'ARCHIVED_CLOSED';
        if (hideClosed && isClosed) return false;
        if (verifiedOnly && !item.verified) return false;
        if (currentFilter !== 'all' && item.discipline !== currentFilter) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchName = (item.name || '').toLowerCase().includes(q);
          const matchPlatform = (item.platform || '').toLowerCase().includes(q);
          if (!matchName && !matchPlatform) return false;
        }
        return true;
      });

      // Sorting
      filtered.sort((a, b) => {
        if (a.verified !== b.verified) return a.verified ? -1 : 1;  // verified first
        if (currentSort === 'prize') {
          return (b.total_prize_usd || 0) - (a.total_prize_usd || 0);
        } else if (currentSort === 'urgency') {
          const da = a.days_remaining !== null ? a.days_remaining : 9999;
          const db = b.days_remaining !== null ? b.days_remaining : 9999;
          return da - db;
        } else {
          return (a.name || '').localeCompare(b.name || '');
        }
      });

      filtered.forEach(item => {
        const isClosed = (item.days_remaining !== null && item.days_remaining < 0) || item.status === 'ARCHIVED_CLOSED';
        if (!isClosed) {
          if (item.verified && item.prize_type !== 'max_bounty_payout') totalPrize += (item.total_prize_usd || 0);
          activeCount++;
        }
        const prizeLabel = item.prize_type === 'max_bounty_payout' ? 'up to ' + formatUSD(item.total_prize_usd) + ' (bounty)' : formatUSD(item.total_prize_usd);
        const verTag = item.verified ? '<div class="unit-tag">✔ Verified on official page</div>' : '<div class="unit-tag" style="color:#f59e0b;">⚠ Unverified lead — confirm on the official page</div>';

        const card = document.createElement('div');
        card.className = 'card' + (isClosed ? ' is-closed' : '');
        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="badge ${getBadgeClass(item.platform, item.discipline)}">${item.platform || 'General'}</span>
              <span class="prize">${prizeLabel}</span>
            </div>
            <div class="temporal-badge ${getTemporalClass(item.temporal_badge)}">${item.temporal_badge}</div>
            <div class="comp-name">${item.name}</div>
            ${verTag}
            <div class="details">${(item.prize_description || '').slice(0, 110)}</div>
          </div>
          <div class="card-footer">
            <span class="deadline">⏳ ${item.deadline_utc ? item.deadline_utc.slice(0, 10) : (item.deadline_type === 'rolling' ? 'Rolling / continuous' : 'Deadline not verified')}</span>
            <span style="color:#3b82f6; cursor:pointer; font-weight:600;">Inspect Dossier &rarr;</span>
          </div>
        `;

        card.addEventListener('click', () => openModal(item));
        grid.appendChild(card);
      });

      document.getElementById('totalPrizes').textContent = '$' + totalPrize.toLocaleString() + ' USD';
      document.getElementById('activeCount').textContent = activeCount;
      document.getElementById('totalCount').textContent = totalCount;
    }

    function openModal(item) {
      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = `
        <span class="badge ${getBadgeClass(item.platform, item.discipline)}" style="margin-bottom:0.5rem; display:inline-block;">${item.platform}</span>
        <div class="temporal-badge ${getTemporalClass(item.temporal_badge)}" style="margin-left:0.5rem;">${item.temporal_badge}</div>
        <h2>${item.name}</h2>
        <div class="modal-prize">${item.prize_type === 'max_bounty_payout' ? 'Up to ' + formatUSD(item.total_prize_usd) + ' (maximum bounty payout, not a prize pool)' : formatUSD(item.total_prize_usd)}</div>
        <p style="color:${item.verified ? '#a7f3d0' : '#f59e0b'}; margin-bottom:1rem;">${item.verified ? 'Verified on the official page.' : (item.notes || 'Unverified lead.')}</p>
        
        <div class="modal-sec">
          <h4>Temporal Status & Verified Runway</h4>
          <p style="font-weight:700;">${item.deadline_utc ? item.deadline_utc.slice(0, 10) : (item.deadline_type === 'rolling' ? 'Rolling / continuous' : 'Not verified')}</p>
        </div>

        <div class="modal-sec">
          <h4>Prize Allocation & Bounty Structure</h4>
          <p>${item.prize_description || 'Not verified — see the official page.'}</p>
        </div>

        <div class="modal-sec">
          <h4>Compute Guardrail (Strict 0 EUR Standard)</h4>
          <p style="color:#a7f3d0;">${item.free_compute_feasibility || 'Not assessed.'}</p>
        </div>

        <div class="modal-sec">
          <h4>Deliverable Specification</h4>
          <p>${item.deliverable || 'Not verified — see the official page.'}</p>
        </div>

        <div class="modal-sec">
          <h4>Governance & Key Constraints (KYC / IP / Eligibility)</h4>
          <p style="color:#9ca3af;">${item.restrictions || 'Not verified — read the official rules before entering.'}</p>
        </div>
      `;
      document.getElementById('modalBackdrop').style.display = 'flex';
    }

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modalBackdrop').style.display = 'none';
    });

    document.getElementById('modalBackdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modalBackdrop') {
        document.getElementById('modalBackdrop').style.display = 'none';
      }
    });

    // Search input listener
    document.getElementById('search').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    // Sort select listener
    document.getElementById('sortSelect').addEventListener('change', (e) => {
      currentSort = e.target.value;
      render();
    });

    // Discipline pills listener
    document.querySelectorAll('.filter-pills .pill:not(.pill-status)').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-pills .pill:not(.pill-status)').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        render();
      });
    });

    // Toggle closed competitions listener
    const toggleVerifiedBtn = document.getElementById('toggleVerified');
    toggleVerifiedBtn.addEventListener('click', () => {
      verifiedOnly = !verifiedOnly;
      toggleVerifiedBtn.classList.toggle('active', verifiedOnly);
      render();
    });

    const toggleClosedBtn = document.getElementById('toggleClosed');
    toggleClosedBtn.addEventListener('click', () => {
      hideClosed = !hideClosed;
      if (hideClosed) {
        toggleClosedBtn.classList.add('active');
        toggleClosedBtn.textContent = '👁️ Hide Closed';
      } else {
        toggleClosedBtn.classList.remove('active');
        toggleClosedBtn.textContent = '👁️ Show All (Including Closed)';
      }
      render();
    });

    // Initial render
    render();
  </script>
