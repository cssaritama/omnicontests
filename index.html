    function formatUSD(num) {
      if (!num || num === 0) return 'Premios Varios';
      return '$' + num.toLocaleString() + ' USD';
    }

    function getBadgeClass(platform, disc) {
      const p = (platform || '').toLowerCase();
      if (p.includes('kaggle')) return 'badge-kaggle';
      if (p.includes('devpost')) return 'badge-devpost';
      if (disc === 'security_and_bounties') return 'badge-security';
      if (disc === 'quantitative_trading') return 'badge-quant';
      return 'badge-other';
    }

    function getTemporalClass(badge) {
      if (badge.includes('URGENTE')) return 'badge-urgent';
      if (badge.includes('CERRADA')) return 'badge-closed';
      return 'badge-active';
    }

    let currentFilter = 'all';
    let hideClosed = true;
    let searchQuery = '';
    let currentSort = 'prize';

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      let totalPrize = 0;
      let activeCount = 0;
      let totalCount = data.length;

      const filtered = data.filter(item => {
        const isClosed = (item.days_remaining !== null && item.days_remaining < 0) || item.status === 'ARCHIVED_CLOSED';
        if (hideClosed && isClosed) return false;
        if (currentFilter !== 'all' && item.discipline !== currentFilter) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchName = (item.name || '').toLowerCase().includes(q);
          const matchPlatform = (item.platform || '').toLowerCase().includes(q);
          const matchUnit = (item.project_unit || '').toLowerCase().includes(q);
          if (!matchName && !matchPlatform && !matchUnit) return false;
        }
        return true;
      });

      // Sorting
      filtered.sort((a, b) => {
        if (currentSort === 'prize') {
          return (b.total_prize_usd || 0) - (a.total_prize_usd || 0);
        } else if (currentSort === 'urgency') {
          const da = a.days_remaining !== null ? a.days_remaining : 9999;
          const db = b.days_remaining !== null ? b.days_remaining : 9999;
          return da - db;
        } else {
          return (a.name || '').localeCompare(b.name || '');
        }
      });

      filtered.forEach(item => {
        const isClosed = (item.days_remaining !== null && item.days_remaining < 0) || item.status === 'ARCHIVED_CLOSED';
        if (!isClosed) {
          totalPrize += (item.total_prize_usd || 0);
          activeCount++;
        }

        const card = document.createElement('div');
        card.className = 'card' + (isClosed ? ' is-closed' : '');
        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="badge ${getBadgeClass(item.platform, item.discipline)}">${item.platform || 'General'}</span>
              <span class="prize">${formatUSD(item.total_prize_usd)}</span>
            </div>
            <div class="temporal-badge ${getTemporalClass(item.temporal_badge)}">${item.temporal_badge}</div>
            <div class="comp-name">${item.name}</div>
            <div class="unit-tag">📌 ${item.project_unit || 'General'}</div>
            <div class="details">${(item.prize_description || item.category || '').slice(0, 110)}...</div>
            <div class="feasibility">⚡ ${item.free_compute_feasibility || '0 EUR viable'}</div>
          </div>
          <div class="card-footer">
            <span class="deadline">⏳ ${item.deadline_utc ? item.deadline_utc.slice(0, 25) : 'Continuo'}</span>
            <span style="color:#3b82f6; cursor:pointer; font-weight:600;">Auditar &rarr;</span>
          </div>
        `;

        card.addEventListener('click', () => openModal(item));
        grid.appendChild(card);
      });

      document.getElementById('totalPrizes').textContent = '$' + totalPrize.toLocaleString() + ' USD';
      document.getElementById('activeCount').textContent = activeCount;
      document.getElementById('totalCount').textContent = totalCount;
    }

    function openModal(item) {
      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = `
        <span class="badge ${getBadgeClass(item.platform, item.discipline)}" style="margin-bottom:0.5rem; display:inline-block;">${item.platform}</span>
        <div class="temporal-badge ${getTemporalClass(item.temporal_badge)}" style="margin-left:0.5rem;">${item.temporal_badge}</div>
        <h2>${item.name}</h2>
        <div class="modal-prize">${formatUSD(item.total_prize_usd)}</div>
        
        <div class="modal-sec">
          <h4>Estado Temporal & Auditoría</h4>
          <p style="font-weight:700;">${item.deadline_utc || 'Abierto continuo'}</p>
        </div>

        <div class="modal-sec">
          <h4>Unidad Asignada</h4>
          <p style="color:#60a5fa; font-weight:600;">${item.project_unit || 'General'}</p>
        </div>

        <div class="modal-sec">
          <h4>Estructura de Premios</h4>
          <p>${item.prize_description || item.category || 'Recompensa sujeta a bases oficiales.'}</p>
        </div>

        <div class="modal-sec">
          <h4>Cómputo & Factibilidad 0 EUR</h4>
          <p style="color:#a7f3d0;">${item.free_compute_feasibility || '100% viable en hardware local o tiers gratuitos.'}</p>
        </div>

        <div class="modal-sec">
          <h4>Formato de Entrega</h4>
          <p>${item.deliverable || 'Código reproducible, notebook o informe técnico.'}</p>
        </div>

        <div class="modal-sec">
          <h4>Restricciones Clave (KYC / IP / Equipos)</h4>
          <p style="color:#9ca3af;">${item.restrictions || 'Elegibilidad global estándar.'}</p>
        </div>
      `;
      document.getElementById('modalBackdrop').style.display = 'flex';
    }

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modalBackdrop').style.display = 'none';
    });

    document.getElementById('modalBackdrop').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalBackdrop')) {
        document.getElementById('modalBackdrop').style.display = 'none';
      }
    });

    document.getElementById('search').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      currentSort = e.target.value;
      render();
    });

    document.getElementById('toggleClosed').addEventListener('click', (e) => {
      hideClosed = !hideClosed;
      e.target.textContent = hideClosed ? '👁️ Ocultar Cerradas' : '👁️ Mostrar Todas (Inc. Cerradas)';
      e.target.classList.toggle('active', hideClosed);
      render();
    });

    document.querySelectorAll('.filter-pills .pill:not(#toggleClosed)').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.filter-pills .pill:not(#toggleClosed)').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.dataset.filter;
        render();
      });
    });

    render();
  </script>
</body>
